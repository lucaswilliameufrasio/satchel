[package]
name = "satchel-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop tray for one folder, the OS keystore, and device pairing."

[dependencies]
rand = "0.10"
satchel-core = { path = "../satchel-core" }
satchel-pair = { path = "../satchel-pair" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
tray-icon = { version = "0.21.2", default-features = false }

[dev-dependencies]
tempfile = "3"
