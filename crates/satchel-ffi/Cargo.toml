[package]
name = "satchel-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "JNI entry points the Android catalog uses to read metadata."

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
satchel-core = { path = "../satchel-core" }
satchel-pair = { path = "../satchel-pair" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
