[package]
name = "satchel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Encrypted, versioned file sync on a restic repository."

[dependencies]
hex = "0.4"
hmac = "0.12"
rand = "0.10.3"
rustic_backend = "0.7.0"
rustic_core = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
webpki-roots = "0.26"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
testcontainers = { version = "0.28.0", features = ["blocking"] }
